[project]
name = "podwash"
version = "0.1.0"
description = "Self-hosted podcast ad-skipping proxy: transcribe, detect, cut, re-serve"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "feedgen>=1.0.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Heavy deps only the Mac worker needs — kept out of the Vultr image to
# avoid OOMs on the 2GB VPS. Install with `uv sync --extra worker`.
worker = [
    "anthropic>=0.39.0",
    "faster-whisper>=1.0.0",
]

[project.scripts]
podwash = "src.api.__main__:main"
podwash-worker = "src.worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
